<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMAI Studio - 技能库交互预览</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">X</div>
        <div><strong>XMAI Studio</strong><span>工作台</span></div>
      </div>

      <nav class="primary-nav" aria-label="主导航">
        <button type="button"><i data-lucide="square-pen"></i><span>新对话</span></button>
        <button type="button"><i data-lucide="search"></i><span>搜索</span></button>
        <button type="button"><i data-lucide="lightbulb"></i><span>提示词库</span></button>
        <button type="button"><i data-lucide="clock-3"></i><span>自动化</span></button>
        <button type="button" class="active"><i data-lucide="zap"></i><span>技能</span></button>
      </nav>

      <div class="sidebar-section">
        <p>最近对话</p>
        <button type="button"><span>本周工作复盘</span><small>刚刚</small></button>
        <button type="button"><span>产品图片整理</span><small>1 小时</small></button>
        <button type="button"><span>活动文案优化</span><small>昨天</small></button>
      </div>

      <div class="account">
        <span class="avatar">梦</span>
        <div><strong>梦蝶</strong><small>钉钉账号</small></div>
        <button type="button" aria-label="更多账户操作"><i data-lucide="ellipsis"></i></button>
      </div>
    </aside>

    <main id="app" class="main-content"></main>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <script src="./vendor/lucide.js"></script>
  <script src="./app.js"></script>
</body>
</html>
