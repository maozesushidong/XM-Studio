<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XMAI Studio 图片预览器</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell" aria-label="XMAI Studio 图片预览交互原型">
    <div class="app-backdrop" aria-hidden="true">
      <aside></aside>
      <section>
        <div class="backdrop-line wide"></div>
        <div class="backdrop-line"></div>
        <div class="backdrop-panel"></div>
      </section>
    </div>

    <div class="modal-backdrop">
      <section class="preview-dialog" role="dialog" aria-modal="true" aria-labelledby="previewTitle">
        <header class="preview-header">
          <div class="preview-title-block">
            <span>应用内预览</span>
            <h1 id="previewTitle">image-1787970481111-1.png</h1>
          </div>
          <button class="icon-button close-button" type="button" data-action="close" title="关闭预览" aria-label="关闭预览">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </header>

        <div class="preview-workspace">
          <div class="image-viewport" id="imageViewport" tabindex="0" aria-label="图片预览区域">
            <div class="image-stage" id="imageStage">
              <div class="cropped-source" id="croppedSource">
                <img src="assets/source-preview.png" alt="AI 星火计划 8 月战报">
              </div>
            </div>
          </div>

          <div class="image-toolbar" role="toolbar" aria-label="图片查看工具">
            <button class="tool-button" type="button" data-action="zoom-out" title="缩小" aria-label="缩小">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>
            </button>
            <button class="zoom-value" type="button" data-action="reset" title="恢复默认大小" aria-label="恢复默认大小"><span id="zoomValue">100%</span></button>
            <button class="tool-button" type="button" data-action="zoom-in" title="放大" aria-label="放大">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <span class="toolbar-divider" aria-hidden="true"></span>
            <button class="tool-button" type="button" data-action="rotate-left" title="向左旋转" aria-label="向左旋转">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
            </button>
            <button class="tool-button" type="button" data-action="rotate-right" title="向右旋转" aria-label="向右旋转">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
            <button class="tool-button download-tool" type="button" data-action="download" title="下载图片" aria-label="下载图片">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
            </button>
          </div>
        </div>

        <footer class="preview-footer">
          <button class="secondary-button" type="button" data-action="copy">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            <span>复制</span>
          </button>
        </footer>
      </section>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
