<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>XMAI 文件资源管理</title>
  <style>
    :root{font-family:"Microsoft YaHei","Segoe UI",sans-serif;color:#162536;background:#f7f8fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f7f8fa}.shell{width:min(1120px,calc(100% - 40px));margin:0 auto;padding:32px 0 64px}.header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:26px}.brand{display:flex;align-items:center;gap:13px}.brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:10px;background:#c52d39;color:#fff;font-size:20px;font-weight:800}.brand h1{margin:0;font-size:22px;line-height:1.25}.brand p{margin:5px 0 0;color:#687787;font-size:13px}.panel{background:#fff;border:1px solid #e0e5eb;border-radius:10px;padding:25px;margin-bottom:18px;box-shadow:0 5px 18px rgba(24,38,54,.04)}.panel h2{margin:0;font-size:18px;line-height:1.4}.panel-head{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:20px}.muted{color:#687787;font-size:13px;line-height:1.6}.auth{max-width:520px;margin:90px auto}.field{display:flex;flex-direction:column;gap:8px;margin:16px 0}.field span{font-size:13px;font-weight:700;color:#344758}.field input,.field textarea{width:100%;border:1px solid #cad4df;border-radius:7px;padding:11px 12px;color:#162536;background:#fff;font:inherit;font-size:14px;outline:none}.field input:focus,.field textarea:focus{border-color:#c52d39;box-shadow:0 0 0 3px rgba(197,45,57,.1)}.field textarea{min-height:100px;resize:vertical}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 22px}.wide{grid-column:1/-1}.file-field{padding:15px;border:1px dashed #bbc8d5;border-radius:8px;background:#fbfcfd}.file-field input{border:0;padding:0;background:transparent}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.button{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:7px;padding:10px 16px;cursor:pointer;font:inherit;font-size:13px;font-weight:700;text-decoration:none;white-space:nowrap}.button:disabled{cursor:wait;opacity:.55}.primary{background:#c52d39;color:#fff}.primary:hover:not(:disabled){background:#a92530}.secondary{background:#fff;border:1px solid #cbd6e0;color:#344f68}.secondary:hover{background:#f7f9fb}.danger{background:#fff;border:1px solid #e5a2aa;color:#b52c39}.danger:hover{background:#fff5f5}.progress{height:8px;background:#edf1f5;border-radius:99px;overflow:hidden;margin-top:20px}.progress span{display:block;height:100%;width:0;background:#c52d39;transition:width .2s}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:830px}th,td{text-align:left;padding:14px 10px;border-bottom:1px solid #edf1f5;vertical-align:middle}th{font-size:12px;color:#687787;font-weight:700}td{font-size:13px}.resource-title{font-weight:700;color:#21384d}.resource-description{display:block;max-width:270px;margin-top:5px;color:#687787;white-space:pre-wrap;line-height:1.5}.file-name{display:block;max-width:235px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.file-size,.date{display:block;margin-top:4px;color:#8794a1;font-size:12px}.status{display:inline-flex;border-radius:99px;padding:4px 9px;font-size:12px;background:#e8f5ee;color:#19734f;white-space:nowrap}.status.disabled{background:#f0f1f3;color:#77808b}.empty{text-align:center;padding:34px;color:#687787}.toast{position:fixed;right:24px;bottom:24px;max-width:min(420px,calc(100% - 48px));padding:12px 16px;border-radius:7px;background:#26384d;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18);font-size:13px;line-height:1.5}.hidden{display:none!important}@media(max-width:700px){.shell{width:calc(100% - 24px);padding-top:20px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.header{align-items:flex-start}.panel{padding:18px}.panel-head{display:block}.panel-head .button{margin-top:14px}.auth{margin:48px auto}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="header">
      <div class="brand"><div class="brand-mark">X</div><div><h1>XMAI 文件资源管理</h1><p>独立下载中心 · 管理员可上传和删除资源</p></div></div>
      <button id="logout" class="button secondary hidden" type="button">退出管理</button>
    </header>

    <section id="auth" class="panel auth">
      <h2>验证管理密码</h2>
      <p class="muted">公开下载页面无需密码，只有资源管理操作需要验证。</p>
      <form id="authForm"><label class="field"><span>管理密码</span><input id="password" type="password" autocomplete="current-password" required></label><button class="button primary" type="submit">进入管理</button></form>
    </section>

    <section id="workspace" class="hidden">
      <section class="panel">
        <div class="panel-head"><div><h2>上传新资源</h2><p class="muted">支持任意客户端软件包或文件，例如 EXE、MSI、ZIP、DMG、APK、文档等。</p></div><a id="publicLink" class="button secondary" target="_blank" rel="noreferrer">打开公开下载页</a></div>
        <form id="resourceForm">
          <div class="grid">
            <label class="field"><span>资源名称</span><input name="title" placeholder="例如：XMAI Studio 客户端" maxlength="160"></label>
            <label class="field"><span>文件</span><span class="file-field"><input name="file" type="file" required></span></label>
            <label class="field wide"><span>资源说明（可选）</span><textarea name="description" maxlength="20000" placeholder="简单说明这个文件的用途"></textarea></label>
          </div>
          <div class="progress"><span id="progressBar"></span></div>
          <p id="progressText" class="muted">等待选择文件</p>
          <div class="actions"><button id="uploadButton" class="button primary" type="submit">上传资源</button></div>
        </form>
      </section>

      <section class="panel">
        <div class="panel-head"><div><h2>已上传资源</h2><p class="muted">每个资源都有独立下载地址。删除后，公开地址立即失效并删除服务器文件。</p></div></div>
        <div class="table-wrap"><table><thead><tr><th>资源名称</th><th>文件</th><th>状态</th><th>上传时间</th><th>下载地址</th><th>操作</th></tr></thead><tbody id="resourceRows"></tbody></table></div>
      </section>
    </section>
  </main>
  <div id="toast" class="toast hidden"></div>
  <script src="admin.js"></script>
</body>
</html>
